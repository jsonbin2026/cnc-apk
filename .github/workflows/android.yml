name: Build Android APK

on:
  push:
    branches: [ master, main ]
  workflow_dispatch:

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Cache Library
        uses: actions/cache@v4
        with:
          path: Library
          key: Library-Android-${{ hashFiles('Assets/**', 'Packages/**', 'ProjectSettings/**') }}
          restore-keys: |
            Library-Android-
            Library-

      - name: Build Android APK
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          targetPlatform: Android
          androidExportType: androidPackage
          androidTargetArchitectures: ARM64
          buildMethod: CncSim.EditorTools.BuildAndroid.Build

      - name: Locate APK
        id: locate
        run: |
          echo "Searching for built APK..."
          found="$(find . -type f -name '*.apk' -not -path './Library/*' | head -n 1)"
          if [ -z "$found" ]; then
            echo "No APK found. Build directory contents:"
            ls -R build 2>/dev/null || true
            exit 1
          fi
          echo "apk_path=$found" >> "$GITHUB_OUTPUT"
          echo "Found APK at: $found"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: CncSim-Android-APK
          path: ${{ steps.locate.outputs.apk_path }}
          if-no-files-found: error
